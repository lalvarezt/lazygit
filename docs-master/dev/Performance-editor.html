<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;font:14px var(--font-sans,system-ui);color:var(--foreground)}figure{margin:0}figcaption{font-size:16px;font-weight:600;margin-bottom:18px}.metric{margin:0 0 24px}.label{font-weight:600;margin-bottom:10px}.row{display:grid;grid-template-columns:52px 1fr 80px;align-items:center;gap:10px;margin:10px 0}.track{height:20px;background:var(--secondary);border-radius:3px}.bar{height:20px;border-radius:3px;background:var(--chart-1)}.after{background:var(--chart-2)}.value{text-align:right;font-variant-numeric:tabular-nums}.note{color:var(--muted-foreground);font-size:12px;line-height:1.5;margin:0 0 14px}.chart{height:105px}</style></head><body><figure><figcaption>Incremental editor measurements</figcaption><div class="metric"><div class="label">4 KB commit-description typing</div><div class="chart" role="img" aria-label="Typing benchmark: 662.229 milliseconds before, 24.157 milliseconds after"><div class="row"><span>Before</span><div class="track"><div class="bar" style="width:100%"></div></div><span class="value">662.2 ms</span></div><div class="row"><span>After</span><div class="track"><div class="bar after" style="width:calc(100% * 24.157 / 662.229)"></div></div><span class="value">24.2 ms</span></div><p class="note">27.4× faster. Three-run microbenchmark medians.</p></div></div><div class="metric"><div class="label">Live 4,067-byte paste · app CPU</div><div class="chart" role="img" aria-label="App CPU for live paste: 1.21 seconds before, 0.15 seconds after"><div class="row"><span>Before</span><div class="track"><div class="bar" style="width:100%"></div></div><span class="value">1.21 s</span></div><div class="row"><span>After</span><div class="track"><div class="bar after" style="width:calc(100% * .15 / 1.21)"></div></div><span class="value">0.15 s</span></div><p class="note">One matched 12-second profile pair. Includes app garbage collection.</p></div></div><p class="note">Each chart has its own scale. App CPU excludes Git subprocesses and terminal-emulator CPU. These figures do not measure a whole-app speedup or a precise latency ratio.</p></figure></body></html>
